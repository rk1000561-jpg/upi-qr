<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>₹30 UPI Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Scan & Pay ₹30</h1>
    <p class="subtitle">Only ₹30 payment is pre-filled in UPI apps</p>

    <div class="qr-box">
      <div class="qr-container">
        <!-- QR Code Image -->
        <img id="qrImage" alt="QR Code Loading..." width="220" height="220" />
        
        <!-- Yahan apni image ka link daalein (Neeche wale link ko hatakar) -->
        <img src="https://raw.githubusercontent.com/rk1000561-jpg/upi-qr/main/IMG_20261114_210349.png" alt="Logo" class="qr-logo" />
      </div>
    </div>

    <p class="upi-id" id="upiIdText"></p>
    <p class="note">Scan with PhonePe, Google Pay, Paytm, or any UPI app</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
