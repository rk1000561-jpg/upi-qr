<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>UPI QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f5f5f5;
      margin:0;
    }
    canvas{
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>

<canvas id="qr"></canvas>

<script>
QRCode.toCanvas(
  document.getElementById("qr"),
  "upi://pay?pa=rohitsher518@ibl&pn=Rohit&am=30&cu=INR",
  { width:300 }
);
</script>

</body>
</html>
