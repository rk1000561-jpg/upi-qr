<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>₹30 UPI Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Scan & Pay ₹30</h1>
    <p class="subtitle">Only ₹30 payment is pre-filled in UPI apps</p>

    <div class="qr-box">
      <!-- Canvas ki jagah ab IMG tag use kiya hai -->
      <img id="qrImage" alt="QR Code Loading..." width="220" height="220" />
    </div>

    <p class="upi-id" id="upiIdText"></p>
    <p class="note">Scan with PhonePe, Google Pay, Paytm, or any UPI app</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
